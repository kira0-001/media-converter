<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b0764"/>
      <stop offset="50%" style="stop-color:#4c1d95"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="26" fill="url(#bgGrad)"/>

  <!-- Subtle grid dots -->
  <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.08)"/>
  <circle cx="40" cy="20" r="1" fill="rgba(255,255,255,0.08)"/>
  <circle cx="80" cy="20" r="1" fill="rgba(255,255,255,0.08)"/>
  <circle cx="100" cy="20" r="1" fill="rgba(255,255,255,0.08)"/>
  <circle cx="20" cy="100" r="1" fill="rgba(255,255,255,0.08)"/>
  <circle cx="100" cy="100" r="1" fill="rgba(255,255,255,0.08)"/>

  <!-- Film strip - left side -->
  <rect x="10" y="38" width="18" height="44" rx="3" fill="none" stroke="rgba(167,139,250,0.4)" stroke-width="1.5"/>
  <rect x="12" y="43" width="14" height="8" rx="1.5" fill="rgba(167,139,250,0.25)"/>
  <rect x="12" y="55" width="14" height="8" rx="1.5" fill="rgba(167,139,250,0.25)"/>
  <rect x="12" y="67" width="14" height="8" rx="1.5" fill="rgba(167,139,250,0.25)"/>
  <!-- film holes -->
  <rect x="10" y="40" width="3" height="3" rx="0.5" fill="rgba(167,139,250,0.5)"/>
  <rect x="10" y="47" width="3" height="3" rx="0.5" fill="rgba(167,139,250,0.5)"/>
  <rect x="10" y="54" width="3" height="3" rx="0.5" fill="rgba(167,139,250,0.5)"/>
  <rect x="10" y="61" width="3" height="3" rx="0.5" fill="rgba(167,139,250,0.5)"/>
  <rect x="10" y="68" width="3" height="3" rx="0.5" fill="rgba(167,139,250,0.5)"/>
  <rect x="10" y="75" width="3" height="3" rx="0.5" fill="rgba(167,139,250,0.5)"/>

  <!-- Sound wave - right side -->
  <!-- outer bars -->
  <rect x="94" y="44" width="4" height="32" rx="2" fill="rgba(167,139,250,0.3)"/>
  <rect x="102" y="50" width="4" height="20" rx="2" fill="rgba(167,139,250,0.3)"/>
  <!-- inner bars -->
  <rect x="88" y="50" width="4" height="20" rx="2" fill="rgba(167,139,250,0.4)"/>
  <!-- center bars -->
  <rect x="100" y="44" width="4" height="32" rx="2" fill="rgba(167,139,250,0.2)"/>

  <!-- Arrow left to bolt -->
  <path d="M 31 60 L 38 60" stroke="rgba(196,181,253,0.5)" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <!-- Arrow bolt to right -->
  <path d="M 82 60 L 88 60" stroke="rgba(196,181,253,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="88,57 92,60 88,63" fill="rgba(196,181,253,0.5)"/>
  <polygon points="31,57 35,60 31,63" fill="rgba(196,181,253,0.5)"/>

  <!-- Glow halo behind bolt -->
  <ellipse cx="60" cy="60" rx="20" ry="20" fill="rgba(139,92,246,0.25)" filter="url(#softglow)"/>

  <!-- Lightning bolt (Zap) - centered -->
  <polygon
    points="67,22 42,64 60,64 53,98 78,56 60,56"
    fill="url(#boltGrad)"
    filter="url(#glow)"
  />
  <!-- bolt highlight -->
  <polygon
    points="67,22 42,64 60,64 53,98 78,56 60,56"
    fill="none"
    stroke="rgba(255,255,255,0.3)"
    stroke-width="1"
  />
</svg>
